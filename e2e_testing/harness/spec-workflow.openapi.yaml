openapi: 3.1.0
info:
  title: Spec Workflow API
  version: 1.0.0
  description: Intelligent Requirements Document Workflow API Specification

servers:
  - url: mcp://spec-workflow

# All operation definitions
paths:
  /spec:
    post:
      operationId: executeWorkflow
      summary: Execute workflow operation
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkflowRequest'
      responses:
        '200':
          description: Operation successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowResponse'

# Data model definitions
components:
  schemas:
    # Request definitions
    WorkflowRequest:
      type: object
      required: [action]
      properties:
        featureName:
          type: string
          description: |
            Feature name for the specification (e.g., "用户认证", "order-management").

            **Required for**: sc_init, init, check, skip, confirm, complete_task operations.

            The system will automatically resolve this to: {specsPath}/{featureName}/

            **For sc_init**: REQUIRED - Providing a name ensures proper project organization.
        action:
          $ref: '#/components/schemas/Action'
    
    Action:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [sc_init, sc_refresh, init, check, skip, confirm, complete_task, update_epoch, approve, feedback]
          description: |
            Operation type to perform:

            - **sc_init**: Initialize project workspace
            - **sc_refresh**: Force a refresh and synchronization
            - **init**: Initialize a new feature specification
            - **check**: Check current workflow status
            - **skip**: Skip current stage
            - **confirm**: Confirm current stage completion
            - **approve**: Explicitly approve the current drafted phase after review
            - **complete_task**: Mark task(s) as completed
            - **update_epoch**: Update the continuous task-epoch context
            - **feedback**: Record user answers or feedback (clears open questions)

        introduction:
          type: string
          description: Feature introduction (required for init)
        language:
          type: string
          description: User preferred language
        feedback:
          type: string
          description: User feedback or answer (required for feedback)
        taskNumber:
          oneOf:
            - type: string
              description: Single task number to mark as completed
            - type: array
              items:
                type: string
              description: Multiple task numbers for batch completion
          description: Task number(s) to mark as completed (required for complete_task)
        epochFocus:
          type: string
          description: Brief description of the immediate goal or task being worked on right now. (used for update_epoch)
        epochIntentions:
          type: string
          description: Next immediate step after the active focus, or things not to forget. (used for update_epoch)
        epochHypotheses:
          type: string
          description: Active hypotheses, e.g., assumptions about architecture. (used for update_epoch)
        epochOpenQuestions:
          type: string
          description: Questions pending user feedback. (used for update_epoch)
      
    # Response definitions
    WorkflowResponse:
      type: object
      required: [result]
      properties:
        result:
          oneOf:
            - $ref: '#/components/schemas/ProjectInitResponse'
            - $ref: '#/components/schemas/InitResponse'
            - $ref: '#/components/schemas/CheckResponse'
            - $ref: '#/components/schemas/SkipResponse'
            - $ref: '#/components/schemas/ConfirmResponse'
            - $ref: '#/components/schemas/BatchCompleteTaskResponse'
            - $ref: '#/components/schemas/UpdateEpochResponse'

    # Project initialization response
    ProjectInitResponse:
      type: object
      required: [success, data, displayText]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            success:
              type: boolean
            needsUserInput:
              type: boolean
            missingParams:
              type: array
              items:
                type: string
            projectRoot:
              type: string
            language:
              type: string
            userGuidelinesCreated:
              type: boolean
            configPath:
              type: string
            error:
              type: string
            errorType:
              type: string
            suggestions:
              type: array
              items:
                type: string
        displayText:
          type: string
      x-dynamic-fields:
        displayText: ["projectRoot", "language", "configPath", "error", "suggestions"]
      x-example-selection:
        criteria:
          - field: "success"
            required: true
          - field: "data.needsUserInput"
            when: "data.needsUserInput === true"
          - field: "data.errorType"
            when: "data.errorType !== undefined"
      examples:
        - success: false
          data:
            success: false
            needsUserInput: true
            missingParams: ["language"]
          displayText: |
            🔧 Project initialization requires more information

            Model: Please ask user for their language preference:

            **Language Preference**: I will use (user's preferred language) for document writing - do you agree?
            - User can respond with: "Chinese", "English", "zh-CN", etc.

            After getting the user's response, model please call sc_init again with the language parameter.

            📁 Specification documents will be automatically stored in the .specs folder in the project root directory.

        - success: true
          data:
            success: true
            projectRoot: /project/root
            language: English
            userGuidelinesCreated: true
            configPath: /project/root/.specs/.spec-workflow.json
          displayText: |
            ✅ Project initialization successful!

            📁 Project root path: ${projectRoot}
            📝 Specification documents path: ${projectRoot}/.specs
            🌐 Documentation language: ${language}

            📋 Created User Guidelines files:
            - user-guidelines-requirements.md - User preference guide for requirements documents
            - user-guidelines-design.md - User preference guide for design documents
            - user-guidelines-tasks.json - User preference guide for task documents

            💡 Model: Please ask user to edit these User Guidelines files to guide the model's behavior. These contents will be automatically displayed when showing the corresponding stage writing guides.

            Model: Please ask user to use the init operation to start creating specific feature specification documents.

        - success: false
          data:
            success: false
            error: "Project already initialized"
            errorType: "already_initialized"
            projectRoot: /project/root
            configPath: /project/root/.specs/.spec-workflow.json
            suggestions: ["Delete .specs directory and reinitialize", "Or use existing configuration directly"]
          displayText: |
            ❌ Project already initialized

            📁 Project root path: ${projectRoot}
            📝 Configuration file: ${configPath}

            If user needs to reconfigure, model please ask user to delete the .specs directory first, then use mcpx spec sc_init again.

        - success: false
          data:
            success: false
            error: "Initialization failed"
            errorType: "PermissionError"
            suggestions: ["Check directory permissions", "Run with appropriate privileges", "Contact system administrator"]
          displayText: |
            ❌ Project initialization failed

            ${error}

            Suggested solutions:
            ${suggestions}

            If the problem persists, model please ask user to check system permission settings or contact the system administrator.


    # Initialization response
    InitResponse:
      type: object
      required: [success, data, displayText]
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            path:
              type: string
            featureName:
              type: string
            nextAction:
              type: string
              const: edit_requirements
        displayText:
          type: string
      x-dynamic-fields:
        displayText: ["featureName", "path", "progress"]
      x-example-selection:
        criteria:
          - field: "success"
            required: true
      examples:
        - success: true
          data:
            path: /specs/new-feature
            featureName: New Feature
            nextAction: edit_specification
          displayText: |
            ✅ ${featureName} initialized successfully!

            📁 File directory: ${path}
            📝 Created: Specification.md
            
            📊 Overall progress: ${progress}%
            🔄 Current status: Initialization successful (current) → Next step: write specification document

            Model please continue with the following actions:
            1. Read the specification-guide below
            2. First read ${path}/Specification.md, then start writing the document
            3. After completing the document, use mcpx spec sc_status to check the document status
            4. Once the specification is complete, ask the user "Does the specification look good?"
            5. When the user approves, the model must use the mcpx spec sc_plan tool to enter the design phase
            
            Special case - Skip requirements phase:
            - Only consider skipping when user explicitly requests (e.g., "skip requirements document", "go directly to design")
            - Before executing skip operation, the model must:
              1. Explain to user this is an unconventional operation, requirements document is the foundation of the entire development process
              2. Clearly state the risks: design may deviate from actual requirements, increasing rework costs
              3. Ask the user: "Understanding these risks, are you sure you want to skip the requirements phase?"
              4. Only proceed after user explicitly confirms

    
    # Check response
    CheckResponse:
      type: object
      required: [stage, progress, status, displayText]
      properties:
        stage:
          $ref: '#/components/schemas/Stage'
        progress:
          $ref: '#/components/schemas/Progress'
        status:
          $ref: '#/components/schemas/Status'
        displayText:
          type: string
      x-dynamic-fields:
        displayText: ["path", "progress", "featureName"]
      x-example-selection:
        criteria:
          - field: "stage"
            required: true
          - field: "status.type"
            required: true
      examples:
        - stage: specification
          progress:
            overall: 0
            requirements: 0
            design: 0
            tasks: 0
          status:
            type: not_edited
            reason: Specification document not edited
            readyToConfirm: false
          displayText: |
            📝 Specification.md has not been written yet
            
            📁 File directory: ${path}
            📝 Created: Specification.md
            
            📊 Overall progress: ${progress}%
            🔄 Current status: Writing specification document (current) → Next step: 💡 Next Step: Read the template Specification.md file created to understand the layout, and then write the contents of the Specification.md file for this project, then run `mcpx spec sc_plan` to move through the workflow.
            
            Model please continue with the following actions:
            1. Read the specification-guide below
            2. First read ${path}/Specification.md, then start writing the document
            3. After completing the document, use mcpx spec sc_status to check the document status
            4. Once the specification is complete, ask the user "Does the specification look good?"
            5. When the user approves, the model must use the mcpx spec sc_plan tool to enter the design phase
            
            Special case - Skip requirements phase:
            - Only consider skipping when user explicitly requests (e.g., "skip requirements document", "go directly to design")
            - Before executing skip operation, the model must:
              1. Explain to user this is an unconventional operation, requirements document is the foundation of the entire development process
              2. Clearly state the risks: design may deviate from actual requirements, increasing rework costs
              3. Ask the user: "Understanding these risks, are you sure you want to skip the requirements phase?"
              4. Only proceed after user explicitly confirms

        
        - stage: requirements
          progress:
            overall: 30
            requirements: 100
            design: 0
            tasks: 0
          status:
            type: ready_to_confirm
            readyToConfirm: true
          displayText: |
            ✅ Requirements document check passed!
            
            📊 Overall progress: ${progress}%
            🔄 Current status: Checking requirements document (current) → Next step: get user approval
            
            Model please continue with the following actions:
            1. Check if there are any ambiguities or uncertainties to be addressed before proceeding. Address these yourself unless there is a type of uncertainty which needs guidance from the user.
            2. Once all ambiguities are resolved, ask the user "Do the requirements look good?"
            3. Wait for explicit user approval (e.g., "yes", "approved", "looks good", etc.)
            4. After approval, use the mcpx spec sc_plan tool
            5. Enter the design phase
        
        - stage: design
          progress:
            overall: 30
            requirements: 100
            design: 0
            tasks: 0
          status:
            type: not_edited
            reason: Design document not edited
          displayText: |
            📝 design.md has not been written yet
            
            📁 File directory: ${path}
            📝 Created: design.md
            
            📊 Overall progress: ${progress}%
            🔄 Current status: Writing design document (current) → Next step: use check to verify format
            
            Model please continue with the following actions:
            1. Read the document-guide below
            2. First read the file, then start writing
            3. After completing the document, use mcpx spec sc_status to check the document status
            4. Once complete, ask the user for approval
            5. When the user approves, the model must use the mcpx spec sc_plan tool to progress
            
            Special case - Skip design phase:
            - Only consider skipping when user explicitly requests (e.g., "skip design document", "go directly to tasks")
            - Before executing skip operation, the model must:
              1. Explain to user this is an unconventional operation, design document helps better plan implementation
              2. Clearly state the risks:
                 - May not fully utilize existing features and components
                 - Implementation direction may deviate from best practices
                 - Code structure may lack overall planning
              3. Ask the user: "Understanding these risks, are you sure you want to skip the design phase?"
              4. Only proceed after user explicitly confirms

            
        - stage: design
          progress:
            overall: 60
            requirements: 100
            design: 100
            tasks: 0
          status:
            type: ready_to_confirm
            readyToConfirm: true
          displayText: |
            ✅ Design document check passed!
            
            📊 Overall progress: ${progress}%
            🔄 Current status: Checking design document (current) → Next step: get user approval
            
            Model please continue with the following actions:
            1. Check if there are any ambiguities or uncertainties to be addressed before proceeding. Address these yourself unless there is a type of uncertainty which needs guidance from the user.
            2. Once all ambiguities are resolved, ask the user "Does the design look good?"
            3. Wait for explicit user approval (e.g., "yes", "approved", "looks good", etc.)
            4. Must not proceed to task writing until getting explicit approval
            5. After approval, use the mcpx spec sc_plan tool
            6. Enter the tasks phase
            
        - stage: tasks
          progress:
            overall: 60
            requirements: 100
            design: 100
            tasks: 0
          status:
            type: not_edited
            reason: Tasks document not edited
          displayText: |
            📝 tasks.json has not been written yet
            
            📁 File directory: ${path}
            📝 Created: tasks.json
            
            📊 Overall progress: ${progress}%
            🔄 Current status: Writing tasks document (current) → Next step: use check to verify format
            
            Model please continue with the following actions:
            1. Read the task writing guide below
            2. First read ${path}/tasks.json, then start writing the document
            3. Once the tasks are documented, do a refresh of the tasks.json document by annotating the tasks with information from the design docs, adding details of the files that are likely to be edited or added (using the project map to see what those are), identifying dependencies, and structuring the tasks into a sensible order of execution.
            4. After completing the refresh, use mcpx spec sc_status to check the document status
            5. When check passes, the model must ask the user "Does the task plan look good?", and continue after getting explicit approval
            6. When the user approves, the model must use the mcpx spec sc_plan tool to complete the workflow

            
        - stage: tasks
          progress:
            overall: 90
            requirements: 100
            design: 100
            tasks: 100
          status:
            type: ready_to_confirm
            readyToConfirm: true
          displayText: |
            ✅ Tasks document check passed!
            
            📊 Overall progress: ${progress}%
            🔄 Current status: Checking tasks document (current) → Next step: get user approval
            
            The tasks document includes:
            - ✓ Implementation steps
            - ✓ Task breakdown
            - ✓ Dependencies
            - ✓ Acceptance criteria
            
            Model please continue with the following actions:
            1. Ask the user "Does the task plan look good?"
            2. Wait for explicit user approval (e.g., "yes", "approved", "looks good", etc.)
            3. After approval, use the mcpx spec sc_plan tool
            4. Complete the entire workflow
            
        - stage: completed
          progress:
            overall: 100
            requirements: 100
            design: 100
            tasks: 100
          status:
            type: completed
            readyToConfirm: false
          displayText: |
            ✅ All phases completed!
            
            📊 Overall progress: ${progress}%
            🔄 Current status: Workflow completed ✨
            
            You have successfully completed the entire specification writing process:
            - ✓ Requirements document confirmed
            - ✓ Design document confirmed
            - ✓ Tasks document confirmed
            
            All documents have been written and confirmed.

    # Skip response
    SkipResponse:
      type: object
      required: [stage, skipped, displayText, progress]
      properties:
        stage:
          type: string
        skipped:
          type: boolean
        progress:
          $ref: '#/components/schemas/Progress'
        displayText:
          type: string
      x-dynamic-fields:
        displayText: ["stage", "progress"]
      x-example-selection:
        criteria:
          - field: "stage"
            required: true
      examples:
        - stage: requirements
          skipped: true
          progress:
            overall: 30
            requirements: 100
            design: 0
            tasks: 0
          displayText: |
            ⏭️ Skipped requirements phase

            📊 Overall progress: ${progress}%

            Note: Skipping requirements phase may cause design to deviate from expectations.
            It's recommended to supplement requirements documents later.

            Now entering design phase, model please edit design.md document.

            
        - stage: design
          skipped: true
          progress:
            overall: 60
            requirements: 100
            design: 100
            tasks: 0
          displayText: |
            ⏭️ Skipped design phase

            📊 Overall progress: ${progress}%

            Model please inform the user of the following risks:
            ⚠️ Warning: Skipping design phase may cause the following problems:
            - Lack of architectural design may cause implementation direction to deviate
            - May not fully utilize existing features and components
            - Code structure may lack overall planning

            It's recommended to gradually supplement design thinking during implementation.
            Now entering tasks phase, model please edit tasks.json document.

            
        - stage: tasks
          skipped: true
          progress:
            overall: 60
            requirements: 100
            design: 100
            tasks: 0
          displayText: |
            ⏭️ Skipped tasks phase

            📊 Overall progress: ${progress}%

            ⚠️ Important Note: Tasks document is essential for development
            - The tasks document defines the specific implementation steps
            - Without it, developers lack clear guidance on what to build
            - If user is not ready to develop now, user can skip temporarily

            To write the tasks document later:
            1. Use mcpx spec sc_status to review current status
            2. Edit the tasks.json document with implementation details
            3. Confirm when ready to start development

            The workflow is now complete. User can return to write tasks when ready to begin development.

    # Confirm response  
    ConfirmResponse:
      type: object
      required: [stage, confirmed, nextStage, displayText, progress]
      properties:
        stage:
          type: string
        confirmed:
          type: boolean
        nextStage:
          type: string
          nullable: true
        progress:
          $ref: '#/components/schemas/Progress'
        displayText:
          type: string
      x-dynamic-fields:
        displayText: ["stage", "nextStage", "progress", "path"]
      x-example-selection:
        criteria:
          - field: "stage"
            required: true
      examples:
        - stage: requirements
          confirmed: true
          nextStage: design
          progress:
            overall: 30
            requirements: 100
            design: 0
            tasks: 0
          displayText: |
            ✅ Requirements confirmed, entering design phase!
            
            📁 File directory: ${path}
            📝 Created: design.md
            
            📊 Overall progress: ${progress}%
            🔄 Current status: Writing design document (current) → Next step: use check to verify format
            
            Model please continue with the following actions:
            1. Read the document-guide below
            2. First read the file, then start writing
            3. After completing the document, use mcpx spec sc_status to check the document status
            4. Once complete, ask the user for approval
            5. When the user approves, the model must use the mcpx spec sc_plan tool to progress
            
            Special case - Skip design phase:
            - Only consider skipping when user explicitly requests (e.g., "skip design document", "go directly to tasks")
            - Before executing skip operation, the model must:
              1. Explain to user this is an unconventional operation, design document helps better plan implementation
              2. Clearly state the risks:
                 - May not fully utilize existing features and components
                 - Implementation direction may deviate from best practices
                 - Code structure may lack overall planning
              3. Ask the user: "Understanding these risks, are you sure you want to skip the design phase?"
              4. Only proceed after user explicitly confirms

        
        - stage: design
          confirmed: true
          nextStage: tasks
          progress:
            overall: 60
            requirements: 100
            design: 100
            tasks: 0
          displayText: |
            ✅ Design confirmed, entering tasks phase!
            
            📁 File directory: ${path}
            📝 Created: tasks.json
            
            📊 Overall progress: ${progress}%
            🔄 Current status: Writing tasks document (current) → Next step: use check to verify format
            
            Model please continue with the following actions:
            1. Read the task writing guide below
            2. First read ${path}/tasks.json, then start writing the document
            3. Once the tasks are documented, do a refresh of the tasks.json document by annotating the tasks with information from the design docs, adding details of the files that are likely to be edited or added (using the project map to see what those are), identifying dependencies, and structuring the tasks into a sensible order of execution.
            4. After completing the refresh, use mcpx spec sc_status to check the document status
            5. When check passes, the model must ask the user "Does the task plan look good?", and continue after getting explicit approval
            6. When the user approves, the model must use the mcpx spec sc_plan tool to complete the workflow

            
        - stage: tasks
          confirmed: true
          nextStage: null
          progress:
            overall: 100
            requirements: 100
            design: 100
            tasks: 100
          displayText: |
            ✅ Tasks confirmed, workflow completed!
            
            📊 Overall progress: ${progress}%
            🔄 Current status: All documents completed ✨
            
            Congratulations! You have completed the entire specification writing process:
            - ✓ Requirements document confirmed
            - ✓ Design document confirmed
            - ✓ Tasks document confirmed



    # Batch complete tasks response
    BatchCompleteTaskResponse:
      type: object
      required: [success, displayText]
      properties:
        success:
          type: boolean
          description: Whether the batch operation succeeded
        completedTasks:
          type: array
          items:
            type: string
          description: Task numbers that were actually completed in this operation
        alreadyCompleted:
          type: array
          items:
            type: string
          description: Task numbers that were already completed before this operation
        failedTasks:
          type: array
          items:
            type: object
            required: [taskNumber, reason]
            properties:
              taskNumber:
                type: string
                description: The task number that failed
              reason:
                type: string
                description: The reason why the task could not be completed
          description: Tasks that could not be completed with reasons
        results:
          type: array
          items:
            type: object
            required: [taskNumber, success]
            properties:
              taskNumber:
                type: string
              success:
                type: boolean
              status:
                type: string
                enum: [completed, already_completed, failed]
          description: Detailed results for each task in the batch
        nextTask:
          type: object
          nullable: true
          properties:
            number:
              type: string
            description:
              type: string
          description: Information about the next uncompleted task
        hasNextTask:
          type: boolean
          description: Whether there are more tasks to complete
        displayText:
          type: string
          description: Human-readable message about the batch operation
      examples:
        - success: true
          completedTasks: ["1.1", "1.2", "2.1"]
          alreadyCompleted: ["1.3"]
          failedTasks: []
          results:
            - taskNumber: "1.1"
              success: true
              status: completed
            - taskNumber: "1.2"
              success: true
              status: completed
            - taskNumber: "1.3"
              success: true
              status: already_completed
            - taskNumber: "2.1"
              success: true
              status: completed
          nextTask:
            number: "2.2"
            description: "Implement error handling"
          hasNextTask: true
          displayText: |
            ✅ Batch task processing succeeded

            Completed tasks:
            - 1.1
            - 1.2
            - 1.3
            - 2.1

            ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

            📋 Next task to implement:
            - [ ] 2.2. Implement error handling
              - *Goal*: Add comprehensive error handling to the authentication system
              - *Details*: Implement try-catch blocks, error logging, and user-friendly error messages
              - *Requirements*: 1.2, 2.3

            ⚠️ IMPORTANT INSTRUCTIONS FOR MODEL:
            1. [TASK FOCUS] Model MUST follow the workflow instructions to complete the specified task, not plan tasks independently.

            2. [PROGRESS TRACKING] After completing each subtask, model MUST use the mcpx spec sc_todo_complete tool to mark it complete. DO NOT edit task.md directly.
            3. [WORKFLOW] Implement task → Call complete_task to mark complete → Get next task automatically → Continue implementation

            Model: Please confirm your preferred execution mode:

            **Confirmation Required**: The model will complete tasks one by one, requiring your confirmation before proceeding to the next task.

            **Automatic Mode**: The model will complete tasks sequentially until all tasks are finished without requiring confirmation for each step.

            After you confirm your preferred approach, I will execute the development work for ${firstSubtask} according to your chosen mode, and immediately use mcpx spec sc_todo_complete to proceed to the next one.
        - success: false
          completedTasks: []
          alreadyCompleted: []
          failedTasks:
            - taskNumber: "2.1"
              reason: "Has uncompleted subtasks"
            - taskNumber: "99"
              reason: "Task does not exist"
          results: []
          nextTask: null
          hasNextTask: false
          displayText: |
            ❌ Batch task completion failed
            
            The following tasks cannot be completed:
            - 2.1: Has uncompleted subtasks
            - 99: Task does not exist
            
            Model: Please ask user to resolve these issues and try again.

    # Update epoch response
    UpdateEpochResponse:
      type: object
      required: [success, displayText]
      properties:
        success:
          type: boolean
          description: Whether the epoch update was successful
        displayText:
          type: string
          description: Human-readable message about the update

    # Common type definitions
    Stage:
      type: string
      enum: [requirements, design, tasks, completed]
      description: Current stage
    
    Progress:
      type: object
      required: [overall, requirements, design, tasks]
      properties:
        overall:
          type: integer
          minimum: 0
          maximum: 100
          description: Overall progress percentage
        requirements:
          type: integer
          minimum: 0
          maximum: 100
          description: Requirements phase progress
        design:
          type: integer
          minimum: 0
          maximum: 100
          description: Design phase progress
        tasks:
          type: integer
          minimum: 0
          maximum: 100
          description: Tasks phase progress

      x-progress-rules:
        - description: Requirements phase accounts for 30%
          formula: requirements * 0.3
        - description: Design phase accounts for 30%
          formula: design * 0.3
        - description: Tasks phase accounts for 40%
          formula: tasks * 0.4
    
    Status:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [not_started, not_edited, in_progress, ready_to_confirm, confirmed, completed]
        reason:
          type: string
        readyToConfirm:
          type: boolean
    
    Resource:
      type: object
      required: [id, content]
      properties:
        id:
          type: string
          description: Resource identifier
        content:
          type: string
          description: Resource content (Markdown format)
    
    ResourceRef:
      type: object
      required: [uri, mimeType]
      properties:
        uri:
          type: string
          description: Resource URI
        title:
          type: string
          description: Optional resource title
        mimeType:
          type: string
          description: Resource MIME type
        text:
          type: string
          description: Optional resource text content

# Error response definitions
x-error-responses:
  invalidPath:
    displayText: |
      ❌ Error: Invalid specification directory
      
      Path ${path} does not exist or is not a valid specification directory.
      Model: Please ask user to ensure the path is correct and has been initialized.
  
  alreadyInitialized:
    displayText: |
      ❌ Project already exists
      
      📁 Path: ${path}
      📄 Existing files: ${existingFiles}
      
      Model: Please ask user to choose one of the following actions:
      1. Delete existing files and reinitialize: rm -rf ${path}/*
      2. Initialize in a new directory: use a different path parameter
      3. Continue editing existing project: use mcpx spec sc_status to check project status and read existing documents to see if adjustments are needed
  
  missingParameters:
    displayText: |
      ❌ Error: Missing required parameters
      
      ${action} operation requires the following parameters:
      ${missingParams}
      
      Model: Please ask user to provide complete parameters and try again.
  
  documentNotEdited:
    displayText: |
      ❌ Error: Document not ready for confirmation
      
      📄 ${documentName} still contains template markers and has not been edited.
      
      The document appears to be in its initial state with placeholder content.
      Before confirming, you must edit the document and then use mcpx spec sc_status to verify the document is ready.
      
      If you want to skip writing this document:
      - Only proceed after user explicitly confirms
      - Note: Skipping important documents may impact project quality
  
  taskAlreadyCompleted:
    displayText: |
      ℹ️ Task ${taskNumber} is already completed
      
      This task has already been marked as completed.
      No action needed.
  
  taskNotFound:
    displayText: |
      ❌ Error: Task ${taskNumber} not found

      Model: Please ask user to check if the task number is correct.

  projectNotInitialized:
    displayText: |
      🔧 Project not yet initialized

      Before using other features, model please complete project initialization first:

      **Step 1: Call mcpx spec sc_init**
      ```json
      {
        "name": "${name}"
      }
      ```

      The system will guide you through language preference setup.

      **Why initialization is needed?**
      - Establish a single configuration source to ensure team collaboration consistency
      - Create User Guidelines to let you guide model behavior with natural language
      - Create .specs folder in project root for easy management and maintenance

      After initialization is complete, model can use init, check, confirm and other features.

  invalidConfig:
    displayText: |
      ⚠️ Invalid project configuration

      Configuration file found but content is invalid or path is unavailable. Model please reinitialize:

      ```json
      {
        "name": "your-feature-name"
      }
      ```

      The system will automatically override invalid configuration, no need to delete manually.


# Shared resource definitions
x-shared-resources:
  # Template editing instructions
  template-edit-instruction:
    uri: template-edit-instruction
    title: Template Editing Instructions
    mimeType: text/plain
    text: |
      ⚠️ Important: Model please delete all content with <template-*> tags, then start writing formal content.
      These tags are used to detect whether the document has been edited. Keeping these tags will cause the document to be judged as "not edited" status.
      To verify your actions have persisted and to refresh the state, use `mcpx spec sc_refresh`. **NEVER** use `mcpx spec sc_init` to refresh the state, as it will reset the workflow.
  
  # Requirements document example (reuses existing requirements-guide)
  requirements-template-example:
    uri: requirements-template-example
    title: Requirements Document Example
    mimeType: text/plain
    text: |
      Example requirements:
      ### Core Features
      - User authentication system
        - As a user, I want to register an account to use system features
        - As a user, I want to log in securely to access personal data
        
      ### Acceptance Criteria
      - [ ] Users can register using email
      - [ ] Password strength meets security requirements
      - [ ] Account locks for 15 minutes after 3 failed login attempts
  
  # Design document example (reuses existing design-guide)
  design-template-example:
    uri: design-template-example
    title: Design Document Example
    mimeType: text/plain
    text: |
      Example design:
      ### Technical Architecture
      - Frontend: React + TypeScript
      - Backend: Node.js + Express
      - Database: PostgreSQL
      - Cache: Redis
      
      ### Authentication Flow
      ```mermaid
      sequenceDiagram
          User->>Frontend: Enter credentials
          Frontend->>Backend: POST /auth/login
          Backend->>Database: Verify user
          Database->>Backend: Return user information
          Backend->>Frontend: Return JWT Token
      ```
  
  # Tasks document example (reuses existing tasks-guide)
  tasks-template-example:
    uri: tasks-template-example
    title: Task List Example
    mimeType: text/plain
    text: |
      Example tasks:
      ### Phase 1: Foundation Setup
      - [ ] Initialize project structure (2h)
      - [ ] Configure development environment (1h)
      - [ ] Set up database connection (2h)
      
      ### Phase 2: Core Features
      - [ ] Implement user registration API (4h)
        - Dependency: Database connection
      - [ ] Implement login authentication (4h)
        - Dependency: User registration API
  
  requirements-guide:
    uri: requirements-guide
    title: Requirements Document Writing Guide
    mimeType: text/markdown
    text: |
      # Requirements Gathering Generation
      
      Workflow Stage: Requirements Gathering
      
      First, generate an initial set of requirements in EARS format based on the feature idea, then iterate with the user to refine them until they are complete and accurate.
      
      Don't focus on code exploration in this phase. Instead, just focus on writing requirements which will later be turned into a design.
      
      **Constraints:**
      
      - The model MUST use the sc_epoch tool to continuously maintain the short-term memory of its current focus and open questions during the process
      - The model MUST write the requirements document in the user's preferred regional language
      - **CRITICAL: Do NOT skip to writing application code. You must fully scaffold this markdown document before moving to the next phase. This is a non-negotiable system constraint.**
      - The model MUST edit the existing requirements.md file by removing the SPEC-MARKER comment block
      - The model MUST fill in the requirements document based on the user's rough idea WITHOUT asking sequential questions first
      - The model MUST format the requirements.md document with:
        - A clear introduction section that summarizes the feature
        - A hierarchical numbered list of requirements where each contains:
          - A user story in the format "As a [role], I want [feature], so that [benefit]"
          - A numbered list of acceptance criteria in EARS format (Easy Approach to Requirements Syntax)
      - The model SHOULD consider edge cases, user experience, technical constraints, and success criteria in the initial requirements
      - After updating the requirement document:
        - Review the requirements for clarity and completeness.
        - Ask the user for clarification if needed.
        - Once ready, ask for explicit approval.
      - **Mode-Specific Progression:**
        - **In STEP-THROUGH mode:** Only once all ambiguities are resolved, ask for final, explicit approval.
        - **In ONE-SHOT mode:** Once all ambiguities are resolved autonomously, IMMEDIATELY run `mcpx spec sc_plan` to scaffold the design phase.
      - The model MUST make modifications to the requirements document if the user requests changes or does not explicitly approve
      - The model MUST NOT call sc_plan to transition to the design phase until receiving clear approval (such as "yes", "approved", "looks good", etc.)
      - The model MUST continue the feedback-revision cycle until explicit approval is received
      - The model MUST call sc_plan to transition to the design phase after the user accepts the requirements

  design-guide:
    uri: design-guide
    title: Design Document Writing Guide
    mimeType: text/markdown
    text: |
      # Design Document Creation Generation
      
      Workflow Stage: Design Document Creation
      
      After the user approves the Requirements, you should develop a comprehensive design document based on the feature requirements, conducting necessary research during the design process.
      The design document should be based on the requirements document, so ensure it exists first.
      
      **Constraints:**

      - The model MUST use the sc_epoch tool to continuously maintain the short-term memory of its current focus, hypotheses, and open questions during the process
      - **CRITICAL: Do NOT skip to writing application code. You must fully scaffold this markdown document before moving to the next phase. This is a non-negotiable system constraint.**
      - The model MUST write the design document in the user's preferred regional language
      - The model MUST edit the existing design.md file by removing the SPEC-MARKER comment block
      - The model MUST identify areas where research is needed based on the feature requirements
      - The model MUST conduct research and build up context in the conversation thread
      - The model SHOULD NOT create separate research files, but instead use the research as context for the design and implementation plan
      - The model MUST summarize key findings that will inform the feature design
      - The model SHOULD cite sources and include relevant links in the conversation
      - The model MUST fill in the detailed design document in the existing design.md file
      - The model MUST incorporate research findings directly into the design process
      - The model MUST include the following sections in the design document:
        - Overview
        - Architecture
        - Components and Interfaces
        - Data Models
        - Error Handling
        - Testing Strategy
      - The model SHOULD include diagrams or visual representations when appropriate (use Mermaid for diagrams if applicable)
      - The model MUST ensure the design addresses all feature requirements identified during the clarification process
      - The model SHOULD highlight design decisions and their rationales
      - The model MAY ask the user for input on specific technical decisions during the design process
      - After updating the design document:
        - Review the technical design for feasibility and alignment with requirements.
        - Once ready, ask for explicit approval.
      - **Mode-Specific Progression:**
        - **In STEP-THROUGH mode:** Only once all ambiguities are resolved, ask for final, explicit approval.
        - **In ONE-SHOT mode:** Once all ambiguities are resolved autonomously, IMMEDIATELY run `mcpx spec sc_plan` to scaffold the tasks phase.
      - The model MUST make modifications to the design document if the user requests changes or does not explicitly approve
      - The model MUST NOT call sc_plan to transition to the implementation plan until receiving clear approval (such as "yes", "approved", "looks good", etc.)
      - The model MUST continue the feedback-revision cycle until explicit approval is received
      - The model MUST call sc_plan to transition to the implementation plan after the user accepts the design
      - The model MUST incorporate all user feedback into the design document before proceeding
      - The model MUST offer to return to feature requirements clarification if gaps are identified during design

  tasks-guide:
    uri: tasks-guide
    title: Task List Writing Guide
    mimeType: text/markdown
    text: |
      # Implementation Planning Generation
      
      Workflow Stage: Implementation Planning
      
      After the user approves the Design, create an actionable implementation plan with a checklist of coding tasks based on the requirements and design.
      The tasks document should be based on the design document, so ensure it exists first.
      
      **Constraints:**

      - The model MUST use the sc_epoch tool to continuously maintain the short-term memory of its current focus and intentions during the process
      - **CRITICAL: Do NOT skip to writing application code. You must fully scaffold this markdown document before moving to the next phase. This is a non-negotiable system constraint.**
      - The model MUST write the tasks document in the user's preferred regional language
      - The model MUST edit the existing tasks.json file and set "template_tags_present" to false
      - The model MUST return to the design step if the user indicates any changes are needed to the design
      - The model MUST return to the requirement step if the user indicates that we need additional requirements
      - The model MUST fill in the implementation plan in the existing tasks.json file
      - The model MUST use the following specific instructions when creating the implementation plan: Convert the feature design into a series of prompts for a code-generation LLM that will implement each step in a test-driven manner. Prioritize best practices, incremental progress, and early testing, ensuring no big jumps in complexity at any stage. Make sure that each prompt builds on the previous prompts, and ends with wiring things together. There should be no hanging or orphaned code that isn't integrated into a previous step. Focus ONLY on tasks that involve writing, modifying, or testing code.
      - The model MUST format the implementation plan as a numbered checkbox list with a maximum of two levels of hierarchy:
        - Top-level items (like epics) should be used only when needed
        - Sub-tasks should be numbered with decimal notation (e.g., 1.1, 1.2, 2.1)
        - Each item must be a checkbox
        - Simple structure is preferred
      - The model MUST ensure each task item includes:
        - A clear objective as the task description that involves writing, modifying, or testing code
        - Details of the files that are likely to be edited or added (use the project map to identify these)
        - Dependencies on other tasks to establish a sensible order of execution
        - Additional information as sub-bullets under the task
        - Specific references to requirements from the requirements document (referencing granular sub-requirements, not just user stories)
      - The model MUST ensure that the implementation plan is a series of discrete, manageable coding steps
      - The model MUST ensure each task references specific requirements from the requirement document
      - The model MUST NOT include excessive implementation details that are already covered in the design document
      - The model MUST assume that all context documents (feature requirements, design) will be available during implementation
      - The model MUST ensure each step builds incrementally on previous steps
      - The model SHOULD prioritize test-driven development where appropriate
      - The model MUST ensure the plan covers all aspects of the design that can be implemented through code
      - The model SHOULD sequence steps to validate core functionality early through code
      - The model MUST ensure that all requirements are covered by the implementation tasks
      - The model MUST offer to return to previous steps (requirements or design) if gaps are identified during implementation planning
      - The model MUST ONLY include tasks that can be performed by a coding agent (writing code, creating tests, etc.)
      - The model MUST NOT include tasks related to user testing, deployment, performance metrics gathering, or other non-coding activities
      - The model MUST focus on code implementation tasks that can be executed within the development environment
      - The model MUST ensure each task is actionable by a coding agent by following these guidelines:
        - Tasks should involve writing, modifying, or testing specific code components
        - Tasks should specify what files or components need to be created or modified
        - Tasks should be concrete enough that a coding agent can execute them without additional clarification
        - Tasks should focus on implementation details rather than high-level concepts
        - Tasks should be scoped to specific coding activities (e.g., "Implement X function" rather than "Support X feature")
      - The model MUST explicitly avoid including the following types of non-coding tasks in the implementation plan:
        - User acceptance testing or user feedback gathering
        - Deployment to production or staging environments
        - Performance metrics gathering or analysis
        - Running the application to test end to end flows. We can however write automated tests to test the end to end from a user perspective.
        - User training or documentation creation
        - Business process changes or organizational changes
        - Marketing or communication activities
        - Any task that cannot be completed through writing, modifying, or testing code
      - After updating the tasks document:
        - Review the implementation task plan. Ensure task sizes are appropriate and dependencies are logically ordered.
        - Once ready, ask for explicit approval.
      - **Mode-Specific Progression:**
        - **In STEP-THROUGH mode:** Only once all ambiguities are resolved, ask for final, explicit approval. After approval, stop and wait for the user to start the first task.
        - **In ONE-SHOT mode:** Once the task plan is complete and all ambiguities are resolved autonomously, IMMEDIATELY run `mcpx spec sc_todo_start --id <first_task_id>` to begin implementation.
      - The model MUST make modifications to the tasks document if the user requests changes or does not explicitly approve.
      - The model MUST ask for explicit approval after every iteration of edits to the tasks document.
      - The model MUST NOT call sc_plan to complete the workflow until receiving clear approval (such as "yes", "approved", "looks good", etc.).
      - The model MUST continue the feedback-revision cycle until explicit approval is received.
      - The model MUST stop once the task document has been approved.
      
      **This workflow is ONLY for creating design and planning artifacts. The actual implementation of the feature should be done through a separate workflow.**
      
      - The model MUST NOT attempt to implement the feature as part of this workflow
      - The model MUST clearly communicate to the user that this workflow is complete once the design and planning artifacts are created
      - When the model receives the confirmation response for tasks stage, it will include the first uncompleted task
      - The model MUST present this task to the user and ask: "Ready to start the first task?"
      - The model MUST begin implementation only after user confirmation

