name: epoch

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  epoch:
    if: |
      contains(github.event.comment.body, ' /oc') ||
      startsWith(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, ' /epoch') ||
      startsWith(github.event.comment.body, '/epoch')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      id-token: write
      contents: read
      pull-requests: read
      issues: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: ./.github/actions/setup-bun

      - name: Run epoch
        uses: anomalyco/epoch/github@latest
        env:
          EPOCH_API_KEY: ${{ secrets.EPOCH_API_KEY }}
          EPOCH_PERMISSION: '{"bash": "deny"}'
        with:
          model: epoch/claude-opus-4-5
